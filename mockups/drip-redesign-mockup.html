<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drip Campaigns – redesign mockup v2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F4F4F2;--surface3:#ECECEA;--border:#E2E2E0;--accent:#1E4C84;--accent2:#2F6FB3;--text:#1A1A1A;--text2:#6A6A6A;--text3:#9A9A9A;--lead:#3d9a4e;--danger:#c94c4c;--warn:#E08A1E;--radius:10px;}
[data-theme="dark"]{--bg:#0f1216;--surface:#171c23;--surface2:#1e242c;--surface3:#272e39;--border:#333b47;--accent:#5b93d6;--accent2:#7aabe4;--text:#e9ecf2;--text2:#aab2bf;--text3:#7f8896;--lead:#5ec272;--danger:#e06b6b;--warn:#e3a93c;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.logo{margin:12px 12px 10px;padding:14px 16px;background:#161210;border-radius:10px}
.logo-text{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:2px;color:#C9A84C}
.logo-sub{font-size:12px;color:#A8915E;letter-spacing:3px;text-transform:uppercase}
.nav{padding:10px 8px}
.nav-sec{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;padding:10px 10px 5px}
.ni{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:7px;font-size:15px;color:var(--text2);margin-bottom:2px;cursor:pointer}
.ni:hover{background:var(--surface2)}
.ni.active{background:var(--surface2);color:var(--accent);font-weight:600}
.nbadge{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:10px;padding:1px 7px}
.nbadge.red{background:var(--danger)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ptitle{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;letter-spacing:1.5px}
.content{flex:1;overflow-y:auto;padding:22px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:7px;font-size:15px;font-family:inherit;font-weight:500;cursor:pointer;border:none;white-space:nowrap}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent2)}
.btn-g{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-g:hover{border-color:var(--text3)}
.btn-d{background:transparent;color:var(--danger);border:1px solid var(--border)}
.btn-w{background:#fff;color:var(--danger);border:none;font-weight:700}
.btn-sm{padding:5px 11px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer}
.ccard:hover{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.5px;white-space:nowrap}
.b-live{background:rgba(61,154,78,.14);color:var(--lead)}
.b-draft{background:var(--surface3);color:var(--text2)}
.b-warn{background:rgba(224,138,30,.15);color:var(--warn)}
.b-red{background:rgba(201,76,76,.13);color:var(--danger)}
.b-blue{background:rgba(30,76,132,.12);color:var(--accent)}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid var(--border);color:var(--text2);letter-spacing:.5px}
.chip.ok{border-color:rgba(61,154,78,.4);color:var(--lead)}
.chip.miss{border-style:dashed;color:var(--text3)}
.muted{color:var(--text2);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stat{display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.back{color:var(--accent);cursor:pointer;font-size:15px;margin-bottom:14px;display:inline-block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:18px 0 16px}
.tab{padding:10px 16px;font-size:15px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tl{max-width:780px}
.em{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;align-items:center}
.em:hover{border-color:var(--accent)}
.em.empty{border-style:dashed;cursor:default}
.em.task{background:var(--surface2)}
.thumb{width:92px;height:72px;border-radius:7px;overflow:hidden;border:1px solid var(--border);flex-shrink:0;background:#fff}
.thumb.blank{display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:12px;background:var(--surface2)}
.ticon{width:92px;height:72px;border-radius:7px;flex-shrink:0;background:rgba(224,138,30,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--warn);font-weight:700;font-size:13px}
.ticon b{font-size:24px}
.num{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.num.gray{background:var(--surface3);color:var(--text2)}
.num.or{background:var(--warn)}
.wait{margin:0 0 0 26px;border-left:2px dashed var(--border);padding:10px 0 10px 24px;display:flex;align-items:center;gap:8px;color:var(--text2);font-size:14px}
select.sm{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-family:inherit;font-size:14px;color:var(--text)}
.estats{display:flex;gap:14px;margin-top:6px;font-size:13px;color:var(--text2)}
.estats b{color:var(--text)}
.addrow{display:flex;gap:10px;margin-top:12px}
.addem{flex:1;border:1px dashed var(--border);border-radius:12px;padding:14px;text-align:center;color:var(--accent);cursor:pointer;font-weight:600}
.addem:hover{border-color:var(--accent)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:12px;border-bottom:1px solid var(--border);font-size:15px;vertical-align:middle}
.link{color:var(--accent);cursor:pointer;font-weight:600}
.prog{display:flex;gap:4px}
.dot{width:20px;height:6px;border-radius:3px;background:var(--surface3)}
.dot.done{background:var(--lead)}.dot.cur{background:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto}
.modal.wide{max-width:960px}
.mhdr{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mtitle{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:1px;color:var(--accent)}
.mx{background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer}
.mbody{padding:20px 22px}
.mftr{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end}
.fl{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px}
.fi{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;font-size:15px;color:var(--text);font-family:inherit;outline:none}
.fg{margin-bottom:16px}
.drop{border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;color:var(--text2);cursor:pointer}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.split{display:grid;grid-template-columns:1fr 1.15fr;gap:20px}
.preview{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#f4f4f4;height:400px;overflow-y:auto}
.tplg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tpl{border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer}
.tpl:hover{border-color:var(--accent)}
.tpl .tt{height:110px;overflow:hidden;background:#fff}
.tpl .tn{padding:8px 10px;font-size:14px;font-weight:600;border-top:1px solid var(--border)}
.pick{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:15px;cursor:pointer}
.pick input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:9px;font-size:15px;display:none;z-index:99}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg div{padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text2);background:var(--surface2)}
.seg div.on{background:var(--accent);color:#fff}
.note{background:var(--surface2);border-radius:9px;padding:12px 14px;font-size:14px;color:var(--text2)}
.mk{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#fff;background:#E08A1E;padding:4px 10px;border-radius:5px;font-weight:700}
.banner{border-radius:10px;padding:13px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:15px}
.banner.red{background:var(--danger);color:#fff}
.banner.amber{background:rgba(224,138,30,.14);color:var(--text);border:1px solid rgba(224,138,30,.45)}
.banner.ok{background:rgba(61,154,78,.1);color:var(--lead);border:1px solid rgba(61,154,78,.3);padding:9px 14px;font-weight:600}
.dayh{font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin:22px 0 8px}
.obx{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--surface)}
.obx.hold{opacity:.72}
.obx .tm{width:62px;font-weight:700;font-size:14px;color:var(--text2)}
.set{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:16px 0;border-bottom:1px solid var(--border)}
.set .t{font-weight:700}
.sw{position:relative;width:44px;height:24px;flex-shrink:0;cursor:pointer}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:var(--surface3);border-radius:12px;transition:.15s}
.sw span:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span:before{left:23px}
.hist{border-left:2px solid var(--border);margin-left:8px;padding-left:20px}
.hi{position:relative;padding:0 0 18px}
.hi:before{content:'';position:absolute;left:-27px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.hi.g:before{border-color:var(--lead);background:var(--lead)}
.hi.o:before{border-color:var(--warn)}
.hi.r:before{border-color:var(--danger)}
.hi .d{font-size:13px;color:var(--text3)}
.two{display:grid;grid-template-columns:1fr 1.3fr;gap:18px;align-items:start}
.legend{font-size:13px;color:var(--text3)}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="logo"><div class="logo-text">PROPERLY</div><div class="logo-sub">Palacios Baker</div></div>
    <div class="nav">
      <div class="nav-sec">Main</div>
      <div class="ni">Dashboard</div><div class="ni">Pipeline</div>
      <div class="ni" id="n-contacts" onclick="showContact('Maria Lopez')">All Contacts</div>
      <div class="ni">Transactions</div><div class="ni">Tasks <span class="nbadge">3</span></div>
      <div class="nav-sec">Marketing</div>
      <div class="ni active" id="n-list" onclick="go('list')">Drip Campaigns</div>
      <div class="ni" id="n-outbox" onclick="go('outbox')">Outbox <span class="nbadge" id="obBadge"></span></div>
      <div class="ni" id="n-templates" onclick="go('templates')">Email Templates</div>
      <div class="nav-sec">Tools</div>
      <div class="ni">Deal Sheet</div><div class="ni">Calendar</div><div class="ni">Team</div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="row"><div class="ptitle" id="ptitle">Drip Campaigns</div><span class="mk">Mockup</span></div>
      <div class="row"><button class="btn btn-g btn-sm" onclick="resetHealth()" title="Bring the warnings back to see them again">Show warnings again</button><button class="btn btn-g btn-sm" onclick="toggleTheme()">Light / dark</button></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- sample email designs (stand-ins for your real designed emails) ---------- */
function design(o){
  return '<div style="font-family:Arial,sans-serif;background:#f4f4f4;padding:14px"><div style="background:#fff;border-radius:8px;overflow:hidden;max-width:520px;margin:auto">'
  +(o.img?'<div style="height:130px;background:'+o.img+';display:flex;align-items:center;justify-content:center;color:#1E4C84;font-weight:bold;font-size:15px">'+o.imgt+'</div>':'')
  +'<div style="background:'+o.c+';color:#fff;padding:20px;text-align:center;font-size:21px;font-weight:bold">'+o.t+'</div>'
  +'<div style="padding:18px;color:#333;font-size:14px;line-height:1.6">'+o.b+'</div>'
  +(o.cta?'<div style="text-align:center;padding-bottom:20px"><span style="background:#C9A84C;color:#fff;padding:10px 22px;border-radius:6px;font-weight:bold;display:inline-block">'+o.cta+'</span></div>':'')
  +'<div style="padding:12px;text-align:center;font-size:11px;color:#999;border-top:1px solid #eee">Palacios Baker Real Estate · <u>'+(o.es?'Cancelar suscripción':'Unsubscribe')+'</u></div></div></div>';
}
var IMG1='linear-gradient(#c9d6e6,#9fb6d1)', IMG2='linear-gradient(#e8dcc0,#c9a84c)';
var DZ={
 wEN:design({c:'#1E4C84',t:'Welcome, {first}!',img:IMG1,imgt:'[ home photo ]',b:'Hi {first}, thanks for letting us help with your home search. Over the next few weeks we will send you market updates and homes we think you will love.',cta:'See new listings'}),
 wES:design({es:1,c:'#1E4C84',t:'¡Bienvenido, {first}!',img:IMG1,imgt:'[ foto de casa ]',b:'Hola {first}, gracias por permitirnos ayudarle a buscar su casa. En las próximas semanas le enviaremos reportes del mercado y casas que creemos que le encantarán.',cta:'Ver casas nuevas'}),
 mEN:design({c:'#C9A84C',t:'Your market update',b:'Hi {first}, median price in your area is <b>$512k</b> and homes are selling in <b>18 days</b>. Here is what that means for you...',cta:'Read the full update'}),
 mES:design({es:1,c:'#C9A84C',t:'Reporte del mercado',b:'Hola {first}, el precio medio en su área es <b>$512k</b> y las casas se venden en <b>18 días</b>. Esto es lo que significa para usted...',cta:'Leer el reporte'}),
 lEN:design({c:'#2F6FB3',t:'Homes picked for you, {first}',img:IMG1,imgt:'[ 3 listing photos ]',b:'We pulled three homes that match what you told us. Want to see any of them this weekend?',cta:'View the homes'}),
 oEN:design({c:'#8a6a1c',t:'Thanks for stopping by, {first}',img:IMG2,imgt:'OPEN HOUSE',b:'It was great meeting you at the open house. Here are a few similar homes nearby...',cta:'See similar homes'}),
 oES:design({es:1,c:'#8a6a1c',t:'Gracias por visitarnos, {first}',img:IMG2,imgt:'CASA ABIERTA',b:'Fue un gusto conocerle en la casa abierta. Aquí tiene algunas casas similares cerca...',cta:'Ver casas similares'}),
 aEN:design({c:'#2d6a4f',t:'Happy home anniversary, {first}!',b:'One year ago you got the keys. We hope the house has become home. Curious what it is worth today?',cta:'Get my home value'}),
 aES:design({es:1,c:'#2d6a4f',t:'¡Feliz aniversario de su casa, {first}!',b:'Hace un año recibió las llaves. Esperamos que la casa ya sea su hogar. ¿Quiere saber cuánto vale hoy?',cta:'Ver el valor de mi casa'})
};
var TEMPLATES=[
 {n:'Welcome new buyer',en:{s:'Welcome to your home search, {first}',h:DZ.wEN},es:{s:'Bienvenido a su búsqueda de casa, {first}',h:DZ.wES}},
 {n:'Market update',en:{s:'Your market update',h:DZ.mEN},es:{s:'Su reporte del mercado',h:DZ.mES}},

 {n:'Home anniversary',en:{s:'Happy home anniversary!',h:DZ.aEN},es:{s:'¡Feliz aniversario de su casa!',h:DZ.aES}}
];
function E(t,wait,stats){var x=TEMPLATES[t];return {type:'email',wait:wait,en:{s:x.en.s,h:x.en.h},es:{s:x.es.s,h:x.es.h},st:stats||{sent:0,clicked:0,replied:0,unsub:0}}}
function T(kind,who,note,wait){return {type:'task',kind:kind,who:who,note:note,wait:wait}}

/* ---------- campaigns + people ---------- */
var camps=[

   {n:'Diego Ramos',e:'dramos@gmial.com',lang:'ES',status:'bounced',step:1,why:'Email address doesn’t exist (typo?)'},

  ]},
 {id:2,name:'Past client check-ins',live:false,set:{reply:true,pause:true,pauseDays:10,weekends:true,time:'7:00 am',oneADay:true},
  steps:[E(4,0),{type:'email',wait:30,en:{s:'',h:''},es:{s:'',h:''},st:{sent:0,clicked:0,replied:0,unsub:0}}],people:[]},
 {id:3,name:'Open house follow-up',live:true,set:{reply:true,pause:true,pauseDays:10,weekends:true,time:'7:00 am',oneADay:true},
  steps:[E(3,0,{sent:18,clicked:5,replied:3,unsub:0}),E(1,2,{sent:14,clicked:2,replied:1,unsub:1}),T('Text','Randy','Quick text: any homes you want to see?',3)],
  people:[{n:'Chris Hall',e:'chall@gmail.com',lang:'EN',status:'active',step:2,next:'Mon Nov 9'},{n:'Elena Cruz',e:'elena.cruz@gmail.com',lang:'ES',status:'active',step:2,next:'Tue Nov 10'}]}
];
var CONTACTS=['Ryan Nguyen','Linda Reyes','Marcus Thompson','Diane Foster','Sofia Garcia','Tom Becker','Elena Cruz','Kevin Ward'];

var H={gmail:false,bounce:true};

/* ---------- outbox (next 7 days) ---------- */
var DAYS=['Mon Nov 9','Tue Nov 10','Wed Nov 11','Thu Nov 12','Fri Nov 13','Mon Nov 16'];
var OB=[
 {d:0,t:'7:00',n:'Maria Lopez',lang:'EN',c:1,si:3,kind:'email'},
 {d:0,t:'7:00',n:'Sofia Garcia',lang:'ES',c:1,si:1,kind:'email'},
 {d:0,t:'7:00',n:'Chris Hall',lang:'EN',c:3,si:1,kind:'email'},
 {d:0,t:'—',n:'Tom Becker',lang:'EN',c:1,si:2,kind:'task'},
 {d:1,t:'7:00',n:'Elena Cruz',lang:'ES',c:3,si:1,kind:'email'},
 {d:1,t:'7:00',n:'Diego Ramos',lang:'ES',c:1,si:0,kind:'email',bad:1},
 {d:1,t:'—',n:'Chris Hall',lang:'EN',c:3,si:2,kind:'task'},
 {d:2,t:'7:00',n:'Linda Reyes',lang:'EN',c:1,si:1,kind:'email'},

    var when=i===0?'The day they’re added':'Day '+day;

/* 4. people statuses (stopped on reply, paused when emailed) */
function statusHtml(p,c){
  if(p.status==='active')return '<span class="badge b-blue">ACTIVE</span><div class="muted" style="margin-top:4px">Next: '+stepLabel(c,p.step-1)+' · '+p.next+'</div>';

  if(p.status==='stopped')return '<span class="badge b-live">REPLIED — STOPPED</span><div class="muted" style="margin-top:4px">'+p.why+'</div>';
  if(p.status==='bounced')return '<span class="badge b-red">ON HOLD — BAD EMAIL</span><div class="muted" style="margin-top:4px">'+p.why+'</div>';
  return '<span class="badge b-draft">FINISHED</span><div class="muted" style="margin-top:4px">Got every step</div>';

/* 5. reminder editor */
function addTask(){cur.steps.push(T('Call','Elda','',3));editTask(cur.steps.length-1,true)}
function editTask(i,isNew){
  var s=cur.steps[i];window._ti=i;window._tnew=isNew;
  openM('<div class="mhdr"><div class="mtitle">Reminder step</div><button class="mx" onclick="cancelTask()">✕</button></div><div class="mbody">'
   +'<div class="fg"><label class="fl">What to do</label><div class="seg" id="tk">'+['Call','Text','Card','Other'].map(function(k){return '<div class="'+(k===s.kind?'on':'')+'" onclick="cur.steps['+i+'].kind=\''+k+'\';editTask('+i+','+(isNew?'true':'false')+')">'+({Call:'Call',Text:'Text',Card:'Handwritten card',Other:'Other'}[k])+'</div>'}).join('')+'</div></div>'
   +'<div class="fg"><label class="fl">Who does it</label><select class="fi" id="twho"><option'+(s.who==='Elda'?' selected':'')+'>Elda</option><option'+(s.who==='Randy'?' selected':'')+'>Randy</option></select></div>'
   +'<div class="fg"><label class="fl">Note for whoever does it</label><input class="fi" id="tnote" value="'+esc(s.note)+'" placeholder="Ask how the search is going"></div>'
   +'<div class="note">On the scheduled day this shows up on their Tasks list with the contact’s name and phone. Nothing is sent automatically. When it’s checked off, the campaign moves on.</div></div>'
   +'<div class="mftr"><button class="btn btn-g" onclick="cancelTask()">Cancel</button><button class="btn btn-p" onclick="saveTask()">Save reminder</button></div>');
}
function cancelTask(){if(window._tnew)cur.steps.splice(window._ti,1);closeM();renderCamp()}
function saveTask(){var s=cur.steps[window._ti];s.who=$('twho').value;s.note=$('tnote').value||'Check in';closeM();renderCamp();toast('Reminder saved')}

function setLive(v){if(v&&cur.steps.some(function(s){return s.type==='email'&&!s.en.h})){toast('Add a design to every email before going live');return}cur.live=v;renderCamp();toast(v?'Campaign is live':'Campaign set to draft — nothing will send')}
function sendTest(){toast('Test sent to banff1997@gmail.com (both language versions)')}

/* ---------- add contacts ---------- */
function addPeople(){window._apm='pick';renderAdd()}
function renderAdd(){
  var m=window._apm,b='<div class="seg" style="margin-bottom:16px"><div class="'+(m==='pick'?'on':'')+'" onclick="_apm=\'pick\';renderAdd()">Pick contacts</div><div class="'+(m==='list'?'on':'')+'" onclick="_apm=\'list\';renderAdd()">A whole list</div><div class="'+(m==='cat'?'on':'')+'" onclick="_apm=\'cat\';renderAdd()">A category</div></div>';
  if(m==='pick')b+='<input class="fi" placeholder="Search by name, email, or phone" style="margin-bottom:8px">'+CONTACTS.map(function(n){return '<label class="pick"><input type="checkbox" value="'+n+'">'+n+'</label>'}).join('');
  if(m==='list')b+=['Christmas card list (212)','Active clients (14)','VIP (9)'].map(function(n,k){return '<label class="pick"><input type="radio" name="l"'+(k==0?' checked':'')+'>'+n+'</label>'}).join('');
  if(m==='cat')b+=['Past Client (390)','Lead (29)','Contact (1,407)','Vendor (279)'].map(function(n,k){return '<label class="pick"><input type="radio" name="c"'+(k==0?' checked':'')+'>'+n+'</label>'}).join('');
  b+='<div class="note" style="margin-top:14px">They start with step 1 on the next weekday send. Anyone already in this campaign, unsubscribed, or with a bad email is skipped — you’ll see a count before anything is added.</div>';
  openM('<div class="mhdr"><div class="mtitle">Add contacts to “'+cur.name+'”</div><button class="mx" onclick="closeM()">✕</button></div><div class="mbody">'+b+'</div><div class="mftr"><button class="btn btn-g" onclick="closeM()">Cancel</button><button class="btn btn-p" onclick="doAdd()">Add to campaign</button></div>');
}
function doAdd(){
  var added=0;
  if(window._apm==='pick'){document.querySelectorAll('#modal input[type=checkbox]:checked').forEach(function(x){cur.people.push({n:x.value,e:x.value.toLowerCase().replace(' ','.')+'@gmail.com',lang:/Sofia|Elena|Linda/.test(x.value)?'ES':'EN',status:'active',step:1,next:'Mon Nov 9'});added++})}
  else{added=window._apm==='list'?212:390;cur.people.push({n:'+ '+added+' more from your selection',e:'(listed individually in the real app)',lang:'—',status:'active',step:1,next:'Mon Nov 9'})}
  if(!added){toast('Pick at least one contact');return}
  closeM();tab='people';renderCamp();toast(added+' added — step 1 goes out Monday morning');
}
function newCamp(){openM('<div class="mhdr"><div class="mtitle">New campaign</div><button class="mx" onclick="closeM()">✕</button></div><div class="mbody"><div class="fg"><label class="fl">Campaign name</label><input class="fi" id="ncn" placeholder="Seller nurture"></div><div class="note">It starts as a Draft with one empty email and the standard rules (stop on reply, pause when emailed, skip weekends). Add designs, send yourself a test, then switch to Live.</div></div><div class="mftr"><button class="btn btn-g" onclick="closeM()">Cancel</button><button class="btn btn-p" onclick="createCamp()">Create campaign</button></div>')}
function createCamp(){var n=$('ncn').value.trim()||'Untitled campaign';var c={id:Date.now(),name:n,live:false,set:{reply:true,pause:true,pauseDays:10,weekends:true,time:'7:00 am',oneADay:true},steps:[{type:'email',wait:0,en:{s:'',h:''},es:{s:'',h:''},st:{sent:0,clicked:0,replied:0,unsub:0}}],people:[]};camps.push(c);closeM();cur=c;tab='steps';view='camp';renderCamp()}

/* ---------- 1. OUTBOX ---------- */
function renderOutbox(){
  view='outbox';$('ptitle').textContent='Outbox';setNav('n-outbox');
  var em=OB.filter(function(o){return o.kind==='email'}).length,tk=OB.length-em;
  var h=healthHtml()+'<div class="row between wrap" style="margin:6px 0 4px;gap:12px"><div><div style="font-size:20px;font-weight:700">Next 7 days: '+em+' emails, '+tk+' reminders</div><div class="muted">Everything the campaigns will do, before it happens. Skip or postpone anything.</div></div>'
   +'<div class="seg"><div class="'+(obFilter==='all'?'on':'')+'" onclick="obFilter=\'all\';renderOutbox()">All</div><div class="'+(obFilter==='email'?'on':'')+'" onclick="obFilter=\'email\';renderOutbox()">Emails</div><div class="'+(obFilter==='task'?'on':'')+'" onclick="obFilter=\'task\';renderOutbox()">Reminders</div></div></div>';
  h+='<div class="dayh">Today · Fri Nov 6</div><div class="obx"><div class="tm">7:00</div><div style="flex:1"><b style="color:var(--lead)">✓ 6 emails sent, 0 failed</b><div class="muted">Maria Lopez, Sofia Garcia, Chris Hall + 3 more</div></div><span class="link" onclick="toast(\'Opens the send log for today\')">See all</span></div>';
  h+='<div class="dayh">Sat Nov 7 – Sun Nov 8</div><div class="muted" style="padding:4px 2px">No sends — “skip weekends” is on.</div>';
  DAYS.forEach(function(d,di){
    var items=OB.map(function(o,k){o.k=k;return o}).filter(function(o){return o.d===di&&(obFilter==='all'||o.kind===obFilter)});
    if(!items.length)return;
    h+='<div class="dayh">'+d+'</div>';
    items.forEach(function(o){
      var c=C(o.c),s=c.steps[o.si],hold=o.kind==='email'&&(!H.gmail||o.bad);
      var title,sub;
      if(o.kind==='task'){title='<span class="badge b-warn">'+s.kind.toUpperCase()+'</span> '+s.kind+' '+o.n;sub='Reminder for <b>'+s.who+'</b> · '+c.name+' › step '+(o.si+1);}
      else{var useES=o.lang==='ES'&&s.es.h,v=useES?s.es:s.en;title=o.n+' <span class="chip">'+o.lang+'</span>';sub=c.name+' › '+stepLabel(c,o.si)+': “'+merge(v.s,o.n)+'”'+(o.lang==='ES'&&!s.es.h?' <i>(English — no Spanish version)</i>':'');}
      h+='<div class="obx'+(hold?' hold':'')+'"><div class="tm">'+(o.kind==='task'?'Task':o.t)+'</div><div style="flex:1;min-width:0"><div style="font-weight:700">'+title+(hold?' <span class="badge b-red">'+(o.bad?'BAD EMAIL':'ON HOLD')+'</span>':'')+'</div><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+sub+'</div></div>'
       +'<div class="row">'+(o.kind==='email'?'<button class="btn btn-g btn-sm" onclick="obPreview('+o.k+')">Preview</button>':'')+'<button class="btn btn-g btn-sm" onclick="obPost('+o.k+')">Postpone a day</button><button class="btn btn-d btn-sm" onclick="obSkip('+o.k+')">Skip</button></div></div>';
    });
  });
  $('content').innerHTML=h;updBadge();
}
function obPreview(k){var o=OB[k],c=C(o.c),s=c.steps[o.si],useES=o.lang==='ES'&&s.es.h,v=useES?s.es:s.en;
  openM('<div class="mhdr"><div class="mtitle">What '+first(o.n)+' will receive</div><button class="mx" onclick="closeM()">✕</button></div><div class="mbody"><div class="muted" style="margin-bottom:8px">'+DAYS[o.d]+' · 7:00 am · from elda@palaciosbaker.com<br>Subject: <b style="color:var(--text)">'+merge(v.s,o.n)+'</b></div><div class="preview">'+merge(v.h,o.n)+'</div></div><div class="mftr"><button class="btn btn-g" onclick="closeM();obSkip('+k+')">Skip this one</button><button class="btn btn-p" onclick="closeM()">Looks good</button></div>')}
function obSkip(k){var o=OB[k];OB.splice(k,1);toast('Skipped — '+first(o.n)+' moves on to the next step');renderOutbox()}
function obPost(k){var o=OB[k];o.d=Math.min(o.d+1,DAYS.length-1);toast('Moved to '+DAYS[o.d]);renderOutbox()}

function findPerson(n){for(var i=0;i<camps.length;i++){var p=camps[i].people.find(function(x){return x.n===n});if(p)return {p:p,c:camps[i]}}return null}
function showContact(n){
  view='contact';window._cn=n;setNav('n-contacts');$('ptitle').textContent='All Contacts';
  var f=findPerson(n),p=f?f.p:{e:n.toLowerCase().replace(' ','.')+'@gmail.com',lang:'EN'};
  var hist=HIST[n]||(f?[{d:'Sun Nov 1',c:'',t:'Added to <b>'+f.c.name+'</b>'}]:[]);
  var h='<span class="back" onclick="go(\'list\')">‹ Drip Campaigns</span><div class="two"><div class="card" style="padding:20px"><div style="font-size:22px;font-weight:700">'+n+'</div><div class="muted">'+p.e+' · Buyer · Language: '+(p.lang==='ES'?'Spanish':'English')+'</div>'
   +'<div style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px"><div class="row between"><div class="fl" style="margin:0">Drip campaigns</div><button class="btn btn-p btn-sm" onclick="quickAdd()">+ Add to campaign</button></div><div id="qa" style="margin-top:12px">'

   +'</div></div></div>';

}
function viewSent(key,n){openM('<div class="mhdr"><div class="mtitle">Exactly what '+first(n)+' received</div><button class="mx" onclick="closeM()">✕</button></div><div class="mbody"><div class="preview">'+merge(DZ[key],n)+'</div></div><div class="mftr"><button class="btn btn-p" onclick="closeM()">Close</button></div>')}
function quickAdd(){
  openM('<div class="mhdr"><div class="mtitle">Add '+window._cn+' to a campaign</div><button class="mx" onclick="closeM()">✕</button></div><div class="mbody">'+camps.map(function(c,k){return '<label class="pick"><input type="radio" name="qc" value="'+k+'"'+(k==0?' checked':'')+'><div><b>'+c.name+'</b> <span class="badge '+(c.live?'b-live':'b-draft')+'">'+(c.live?'LIVE':'DRAFT')+'</span><div class="muted">'+c.steps.length+' steps</div></div></label>'}).join('')+'</div><div class="mftr"><button class="btn btn-g" onclick="closeM()">Cancel</button><button class="btn btn-p" onclick="doQuick()">Add</button></div>');
}
function doQuick(){var c=camps[+document.querySelector('input[name=qc]:checked').value];if(c.people.find(function(x){return x.n===window._cn})){closeM();toast('Already in '+c.name);return}c.people.push({n:window._cn,e:window._cn.toLowerCase().replace(' ','.')+'@gmail.com',lang:'EN',status:'active',step:1,next:'Mon Nov 9'});closeM();showContact(window._cn);toast('Added to '+c.name)}
